
name: style_store
description: "A Flutter e-commerce clothing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dartz: ^0.10.1
  get_it: ^9.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/products.json
    - assets/icon/clothes-hanger.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/clothes-hanger.png"
  adaptive_icon_background: "#173D2B"
  adaptive_icon_foreground: "assets/icon/clothes-hanger.png"